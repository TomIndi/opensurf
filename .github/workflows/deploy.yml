name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # The SURF relay (worker/): lets the static site download catalog maps and read KSF world records. This
          # repository's relay is the default; the repository variable SURF_RELAY_URL (Settings > Secrets and
          # variables > Actions > Variables) overrides it, e.g. in a fork.
          VITE_SURF_RELAY: ${{ vars.SURF_RELAY_URL || 'https://opensurf-relay.tomasindi360.workers.dev' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Not the usual `github-pages` environment: enabling Pages created that one with a deployment branch rule
    # allowing only the repository's default branch (`claude/base` here), which refuses every deploy from `main`.
    # actions/deploy-pages accepts another environment name; this one has no branch rule (deploys only run on
    # pushes to main / master and manual runs, see `on:` above).
    environment:
      name: pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

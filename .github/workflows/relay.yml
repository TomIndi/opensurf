name: Deploy SURF relay (Cloudflare Worker)

# Optional: deploys worker/ to Cloudflare Workers when the repository has the secrets CLOUDFLARE_API_TOKEN (a token
# with the "Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID. Without them the job is skipped cleanly.
# Optional repository variable SURF_RELAY_ALLOWED_ORIGINS overrides wrangler.toml's ALLOWED_ORIGINS
# (comma-separated origins, e.g. https://<user>.github.io,http://localhost:5173).

on:
  push:
    branches: [main, master]
    paths:
      - worker/**
      - src/maps/drive.ts
      - src/maps/ksfproxy.ts
      - .github/workflows/relay.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=SURF relay not deployed::Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to deploy worker/ (see worker/README.md)."
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install wrangler
        if: steps.creds.outputs.ok == 'true'
        working-directory: worker
        run: npm ci
      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy ${{ vars.SURF_RELAY_ALLOWED_ORIGINS && format('--var ALLOWED_ORIGINS:{0}', vars.SURF_RELAY_ALLOWED_ORIGINS) || '' }}
